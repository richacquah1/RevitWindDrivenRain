name: Validate browsable source project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/RevitWindDrivenRain/**"
      - ".github/workflows/publish-source.yml"

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source project structure
        shell: bash
        run: |
          test -f "source/RevitWindDrivenRain/RevitWindDrivenRain.sln"
          test -f "source/RevitWindDrivenRain/RevitWindDrivenRain.csproj"
          find "source/RevitWindDrivenRain" -type f -name '*.cs' -print -quit | grep -q .
          echo "Source folder, Visual Studio solution, project file and C# source files are present."
